name: PR body check

# `scripts/pr-body-check.cjs` as a required CI check (#3367 item 3).
#
# WHY A SIBLING WORKFLOW, NOT A JOB IN ci.yml. ci.yml's `build` job is the
# three-platform cargo/npm matrix — a body check has nothing to do with it, and
# folding it in would pay matrix triple-duplication and couple the receipt gate to
# Rust/toolchain setup it does not need. A sibling keeps the matrix's cost shape
# untouched, and an unfiltered `pull_request` trigger (no `paths:`) is what makes
# the check a check that always reports: a path-filtered required status check
# never runs on a PR that does not touch the filter and stays PENDING for the
# purposes of branch protection forever — the trap actionlint.yml documents in
# its own header.
#
# THE SCRATCH EXEMPTION. `[scratch]`-titled PRs are red-before-green
# counterfactuals whose bodies are deliberately stale — the body IS the defect
# under test (convention per ci.yml's `plan` job; never merged). A MISMATCH on
# one is the feature working, so the whole JOB is skipped for them and nothing
# reports red; the report they would have produced is the one their author runs
# by hand, as always. On every other PR any MISMATCH fails the run; CHECK rows
# are printed for every PR, since they are sentences to re-read, not defects.

on:
  pull_request:
    # `edited` is the point: a body-only fix must re-run this check on its own,
    # with no push to the branch — that is the collateral-of-a-fix class the
    # checker exists for (#2168).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # `gh pr view` needs only read; the token below is the read-only fork variant
  # on forked PRs, which is fine — the script reads the PR body and the git
  # objects, and `refs/pull/N/head` is fetchable with contents: read.

concurrency:
  group: prbodycheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body-check:
    # Report-only on [scratch] PRs, refusing on everything else: the JOB is
    # skipped for a [scratch]-titled PR, so a scratch body's MISMATCH rows gate
    # nothing (same convention as ci.yml's plan job, #1685). `github.event` is
    # absent on pushes to main — this workflow deliberately does not run
    # there: there is no PR body to check on a push.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[scratch')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script is dependency-free CJS (no `require` beyond node: builtins),
      # so there is no `npm ci` here — the script needs node alone.
      #
      # THE GATE ITSELF: `--gate` is the one invocation on which the script
      # exits nonzero — 1 on any MISMATCH from a COMPLETED run (documented in
      # the script's header and USAGE). A checker CRASH still exits 0 with the
      # reason on stderr: that is the script's long-standing contract that a
      # crash must not read as a body defect, and the corpus step below is what
      # turns a broken instrument into a red (its rows are caught as
      # unparsable there) rather than this step. The report prints in full:
      # every CHECK row is visible to whoever reads the failed run.
      - name: Run the checker, refusing on any MISMATCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          pr="${{ github.event.pull_request.number }}"
          node scripts/pr-body-check.cjs --pr "$pr" --repo "$GITHUB_REPOSITORY" --gate

      # The corpus proof (#3367 item 3's precondition, the
      # known-good-subjects convention): run the same job logic over the last
      # 10 merged PRs before this check can refuse. This step runs on THIS
      # repo's PRs too (the corpus is always merged main), which doubles as a
      # live canary — a body shape merged since the last proof that the
      # checker now false-flags shows up as a red CORPUS step rather than a
      # red gate. `--repo` is explicit so the corpus is this repo's PRs, not
      # whatever the checkout's remote is. `|| true` on the per-PR invocation
      # keeps a checker CRASH from counting as a corpus pass: the crash is
      # caught by the missing summary line below, which reports it as
      # unparsable and fails the corpus step.
      - name: Corpus dry run over the last 10 merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          failures=0
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 10 --json number --jq '.[].number'); do
            out="$(node scripts/pr-body-check.cjs --pr "$pr" --repo "$GITHUB_REPOSITORY" 2>&1 || true)"
            summary="$(printf '%s\n' "$out" | grep -E '^SUMMARY pr-body-check' | tail -n 1)"
            mismatch="$(printf '%s' "$summary" | sed -n 's/.*: \([0-9][0-9]*\) MISMATCH.*/\1/p')"
            printf 'PR #%s  %s\n' "$pr" "${summary:-<no summary line — checker failed>}"
            if [ -z "$mismatch" ] || [ "$mismatch" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::error::corpus PR #$pr: ${mismatch:-<unparsable>} MISMATCH — a merged body this check would refuse; the check must not ship as required until the script is fixed or this shape is exempted"
              printf '%s\n' "$out"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "corpus: $failures of 10 merged PRs produce MISMATCH — see the rows above"
            exit 1
          fi
          echo "corpus: 0 MISMATCH over the last 10 merged PRs"
