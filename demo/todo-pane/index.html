<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orrerix — To-Do pane (S0 mock, #3263)</title>
<!-- Pre-paint ground, the same trick src/index.html uses: the app's own
     surface colour is set before the stylesheet loads so the page never
     flashes white on a dark desktop. -->
<style>html{background:#111111;color-scheme:dark}</style>
<link rel="stylesheet" href="todo.css">
</head>
<body>

<div class="stage" data-motion="on">

  <!-- Demo scaffolding. Not part of the pane design — S4 inherits .pane. -->
  <header class="stagebar">
    <span class="stagebar-title">to-do pane · S0 mock · #3263</span>

    <span class="ctl-group">
      <span class="ctl-label">fixture</span>
      <select class="ctl" data-a="fixture">
        <option value="mixed">mixed — global + workspace, agents, overdue</option>
        <option value="empty">empty — the quick-add IS the empty state</option>
        <option value="busy">busy — 500 items, scroll and search</option>
      </select>
    </span>

    <span class="ctl-group">
      <span class="ctl-label">clock</span>
      <button class="ctl" type="button" data-a="clock" data-h="9">09:00</button>
      <button class="ctl" type="button" data-a="clock" data-h="14" aria-pressed="true">14:00</button>
      <button class="ctl" type="button" data-a="clock" data-h="23">23:00</button>
    </span>

    <span class="ctl-group">
      <button class="ctl" type="button" data-a="reset">Reset</button>
      <button class="ctl" type="button" data-a="motion" aria-pressed="false">Motion on</button>
    </span>

    <span class="stagebar-spacer grow"></span>
    <span class="ctl-label">keyboard: <span class="mono">n / j k / space / e / i / t / u / g / 1-5</span></span>
  </header>

  <main class="grid">

    <!-- ===================== cell 1 — a narrow grid cell ==================== -->
    <!-- The pane occupies the cell a terminal would (CLAUDE.md constraint 1).
         There is no PTY behind it and no code path here can resize one. This
         cell is deliberately ~320px: the pane has to read at a grid cell's
         width, which is where a side panel would have stopped working and is
         why the row detail expands INLINE. -->
    <section class="cell">
      <span class="cell-label">320 px cell</span>
      <div class="pane" id="pane-narrow" aria-label="To-Do, narrow"></div>
    </section>

    <!-- ========================= cell 2 — a full tile ======================= -->
    <!-- The same render at tile width. Both cells are driven from ONE state
         object, so anything you change in one appears in the other: that is
         the demo's way of showing the layout is responsive rather than two
         layouts that happen to agree. -->
    <section class="cell">
      <span class="cell-label">full tile</span>
      <div class="pane" id="pane-wide" aria-label="To-Do, wide"></div>
    </section>

  </main>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
