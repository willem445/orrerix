[[set]]
identifier = "orch-read"
description = "Read-only orchestration queries: tasks, audit log, merge queue, human questions, needs-you items, session roles, recorded orchestrations, autonomy/usage/summary, the persisted usage time series, workflow preview/status, channel list, notification/spawn state, per-CLI model knobs."
permissions = [
    "allow-agent-autopilot-flags",
    "allow-agent-cli-knobs",
    "allow-orch-tasks",
    "allow-orch-audit",
    "allow-orch-usage-series",
    "allow-orch-merge-queue",
    "allow-orch-session-roles",
    "allow-orch-list-recorded",
    "allow-orch-group-paused",
    "allow-orch-notify-enabled",
    "allow-orch-spawn-expanded",
    "allow-orch-autonomy",
    "allow-orch-group-usage",
    "allow-orch-group-summary",
    "allow-orch-group-view",
    "allow-orch-strip-view",
    "allow-orch-workflow-preview",
    "allow-orch-workflow-list",
    "allow-orch-workflow-status",
    "allow-orch-workflow-switch-preview",
    "allow-orch-group-watches",
    "allow-orch-lock-state",
    "allow-orch-mailbox-status",
    "allow-orch-questions-list",
    "allow-orch-needs-you-list",
    "allow-orch-channel-list",
    "allow-orch-channel-for-pane",
]
