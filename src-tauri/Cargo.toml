[package]
license = "Apache-2.0"
name = "orrerix"
version = "1.3.0-beta11"
description = "A sleek terminal multiplexer for AI agent management"
edition = "2021"

[lib]
name = "loomux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Tauri-free orchestration core (#888 slice A2). THE ARROW ONLY POINTS THIS
# WAY: src-tauri depends on the engine, never the reverse — see
# doc/design/engine-extraction.md. A workspace path dependency, not a version:
# the crate is `publish = false` and both its consumers are in this repo.
#
# NO GETRANDOM AUDIT ENTRY IS NEEDED FOR IT HERE, and that is a property to
# preserve rather than a gap. The engine's dependencies are audited in
# crates/loomux-engine/Cargo.toml, against this same rule and for the same
# reason — the ban follows the shipped binary's load-time imports, and that
# crate is linked into it. Every one it has taken so far (serde, serde_json,
# serde_norway, sha2, dirs) is a crate THIS manifest already depends on
# directly, so the linked graph the ban reasons about is unchanged by the
# extraction and the audits below remain the reference for all of them. The day
# the engine takes one that is not already here, that is the day this line stops
# being true and the audit has to be written over there.
loomux-engine = { path = "../crates/loomux-engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
# Orchestration backend: local MCP server (thread-per-request HTTP).
# NOTE: keep getrandom-based crates (uuid v4, rand) out of this tree — they
# import bcryptprimitives.dll!ProcessPrng, which this project's Windows 10
# baseline doesn't export, and the binary then fails to load (0xc0000139).
# Agent tokens use std's OS-seeded RandomState instead.
tiny_http = "0.12"
tauri-plugin-dialog = "2"
sysinfo = "0.33"

# File hashing for the file-manager pane (#214): a short SHA-256 per row, plus an
# on-demand Hash submenu (SHA-256/512, SHA-1, CRC-32/16/8).
#
# VETTED AGAINST THE GETRANDOM BAN above — which is the only reason this is three lines
# rather than a hand-rolled SHA-256. Audit run 2026-07-11; re-run any time with the
# commands below.
#
# THE QUESTION IS NOT "does the lock contain getrandom" — it already did, three times over,
# and does on main today. It is "do THESE crates add a getrandom path". They do not:
#
#   cargo tree -e normal --target all -p sha2 / -p sha1 / -p crc
#     sha2 / sha1 → cfg-if, cpufeatures → libc, digest → block-buffer →
#                   generic-array → typenum          (no getrandom anywhere)
#     crc         → crc-catalog                      (a pure lookup-table crate, zero deps)
#
# For completeness, every getrandom in the lock and where it comes from — ALL PRE-EXISTING,
# none of them ours (this is what the commands actually print, verbatim shape):
#
#   cargo tree -e normal --target all -i getrandom@0.2.17
#     → getrandom v0.2.17 └── redox_users → dirs-sys → dirs → {orrerix, tauri, wry}
#       REDOX-ONLY. `dirs` gates redox_users behind cfg(target_os = "redox"), so this edge
#       exists only under `--target all`; it is not compiled on Windows/macOS/Linux.
#   cargo tree -e normal --target all -i getrandom@0.3.4
#     → getrandom v0.3.4 └── tauri v2.11.5           (tauri's own)
#   cargo tree -e normal --target all -i getrandom@0.4.3
#     → getrandom v0.4.3 └── uuid → cfb → infer → tauri-utils → tauri-codegen/-macros
#       (tauri's build/codegen chain)
#
# The binary loads today with all three present, so the ProcessPrng hazard is not what
# these edges are — but they are named here so a future auditor re-running the commands
# isn't ambushed by output the comment didn't predict. (An earlier version of this comment
# claimed 0.2.17 printed nothing and never mentioned 0.4.3; rev-106 caught it. The
# CONCLUSION was right; the recorded evidence has to be reproducible too.)
#
# Cost in new packages: `sha2` was ALREADY in Cargo.lock (a tauri transitive) with its whole
# chain, and `sha1` reuses that chain — so these three lines add exactly THREE packages:
# sha1, crc, crc-catalog. Hashing is not a place to be clever: these are the RustCrypto
# reference implementations, and the integration tests check them against the published
# FIPS 180-4 / CRC-catalogue vectors rather than against themselves.
sha2 = "0.10"
sha1 = "0.10"
crc = "3"

# YAML for `<repo>/.loomux/workflow.yml` — the declared agent roster (#222).
#
# VETTED AGAINST THE GETRANDOM BAN above. Audit run 2026-07-11; reproduce with:
#
#   cargo tree -e normal --target all -p serde_norway
#     serde_norway → indexmap (→ equivalent, hashbrown), itoa, ryu, serde,
#                    unsafe-libyaml-norway            (no getrandom anywhere)
#
# The three getrandom edges in the lock are UNCHANGED by this — they are the
# pre-existing ones the note above already enumerates (redox-only via dirs;
# tauri's own; tauri's uuid/codegen chain). Nothing here adds a fourth. New
# packages: serde_norway, unsafe-libyaml-norway, ryu (indexmap/hashbrown were
# already in the lock via tauri).
#
# WHY NOT `serde_yaml`: dtolnay archived it (0.9.34 ships as `+deprecated`).
# `serde_norway` is the maintained fork of the same code — same API, same
# author lineage, still releasing. `serde_yaml_ng` is the other live fork; both
# sit on the same libyaml transliteration, so the choice came down to which is
# more actively maintained.
#
# WHY NOT HAND-ROLL, given this repo hand-rolls its MCP JSON-RPC and its
# `.github/agents` frontmatter skim: those parse formats loomux *defines*.
# `workflow.yml` is written by hand by users, who will reach for block scalars,
# flow sequences, anchors and comments. A subset parser would not fail on those
# — it would MISREAD them, and a misread workflow file silently changes which
# agent gets which prompt. Better a real parser and a strict validation pass
# (`workflow::parse_workflow`) that names every problem.
#
# ATTACK SURFACE, stated plainly: unsafe-libyaml-norway is an unsafe
# transliteration of libyaml, and it parses a file that comes from the repo. The
# repo is one whose source code loomux's agents already read and execute, so this
# does not cross a trust boundary that wasn't already crossed — but it is why
# the parser's *output* is treated as untrusted (capability closure, id/persona
# sanitization) rather than merely its input. See doc/design/workflows.md.
serde_norway = "0.9.42"

# Read-only SQLite, for OpenCode's session/message store (#722). OpenCode keeps
# per-session cost and token counters in one `session` row of a single SQLite
# database (`OPENCODE_DB`, per group — see doc/design/opencode.md); loomux reads
# that row and never writes it (`src/opencodedb.rs` opens `mode=ro`).
#
# VETTED AGAINST THE GETRANDOM BAN above. Audit run 2026-08-03; reproduce with
# the commands below (all are resolution/graph queries — none compiles).
#
# WHAT THE BAN ACTUALLY TESTS, because this entry is the one that gets copied:
# the 0xc0000139 failure is a **load-time import of the shipped orrerix.exe**.
# So the question is only ever "can this crate's code end up LINKED INTO that
# binary". Three kinds of edge cannot, whatever `cargo tree` shows:
#   - **build-dependencies** — they compile and RUN ON THE HOST during the
#     build (build scripts, proc macros). Nothing they link reaches orrerix.exe.
#   - **dev-dependencies of a dependency** — never built for a downstream crate.
#   - **edges gated to a target we do not ship**, e.g. redox-only.
# "No getrandom in `-e normal,build`" is NOT the bar and this dependency does
# not meet it (see below). The bar is the NORMAL (linked) graph.
#
# THE LINKED GRAPH — this is the load-bearing check:
#
#   cargo tree -e normal --target x86_64-pc-windows-msvc -p rusqlite
#     rusqlite → bitflags, fallible-iterator, fallible-streaming-iterator,
#                smallvec, libsqlite3-sys       (no getrandom at any depth)
#
# rusqlite DOES list `getrandom` — as a `[dev-dependencies]` entry, for its own
# wasm test suite. Never built for us; `-e normal` is what makes that visible
# rather than assumed. `default-features = false` is deliberate on top of that:
# rusqlite's default `cache` feature pulls hashlink → hashbrown, and its default
# `ffi-sqlite-wasm-rs` pulls a wasm FFI backend — neither is wanted for a
# handful of one-shot SELECTs, and dropping both keeps the added graph to the
# five packages named below.
#
# THE BUILD-SIDE EDGE, NAMED SO A FUTURE AUDITOR IS NOT AMBUSHED (rev-298 B1,
# which caught an earlier version of this note asserting the opposite):
# **Cargo.lock contains `cc → jobserver → getrandom 0.4.3`**, and jobserver
# declares that dependency `[target."cfg(windows)".dependencies]` — i.e.
# specifically on the target this ban is about. It is fine, twice over:
#   1. `cc`/`jobserver` are BUILD-dependencies (libsqlite3-sys's build script).
#      Host-side; never linked into orrerix.exe. See the rule above.
#   2. It is PRE-EXISTING. `cc` and `jobserver` are both already in the base
#      lock, so this dependency adds no getrandom path — it adds a new
#      *consumer* of a build-dep that already pulled one. `git diff` on
#      Cargo.lock for this change touches ZERO getrandom/jobserver lines.
#
# Expect `cargo tree` and `Cargo.lock` to DISAGREE here, and know why before
# concluding anything: the lock records the union of a package's possible
# dependencies, while `cargo tree` applies feature resolution. jobserver is
# gated behind `cc`'s `parallel` feature, which nothing in this graph enables,
# so `cargo tree -e normal,build … -i jobserver` prints "nothing to print"
# while the lock plainly lists it. Neither output is wrong; a note that quotes
# only the first and says "no getrandom anywhere" IS.
#
#   cargo tree -e normal --target all -i getrandom@0.2.17 / @0.3.4 / @0.4.3
# still prints only the three PRE-EXISTING NORMAL-graph edges the note above
# enumerates (redox-only via dirs; tauri's own; tauri's uuid/codegen chain) —
# this dependency adds no fourth.
#
# `bundled` compiles SQLite's own C amalgamation into the binary via the `cc`
# build-dependency. That is the point, not a side effect: constraint 8 (no
# operator-setup assumptions) rules out linking whatever `sqlite3.dll` happens
# to be on a user's machine, and the C core is plain ANSI C with no CSPRNG
# import — SQLite's randomness comes from its own VFS, which on Windows uses
# the system time and process/thread ids, never bcryptprimitives!ProcessPrng.
# Cost, stated plainly: a cold `cargo check`/`cargo test` now compiles ~250k
# lines of C once per platform (cached by swatinem/rust-cache thereafter), and
# exactly five packages enter the lock — rusqlite, libsqlite3-sys,
# fallible-iterator, fallible-streaming-iterator, vcpkg. bitflags, smallvec,
# cc and pkg-config were already there.
#
# WHY NOT hand-roll a SQLite file-format reader, given this repo hand-rolls its
# MCP JSON-RPC: the same line as `serde_norway`'s — loomux does not *define*
# this format. It is a b-tree file with overflow pages, a write-ahead log, and
# a live writer appending to it; a subset reader would not fail cleanly on a
# WAL frame it did not understand, it would return a stale or wrong number and
# call it an agent's spend.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# Vendor-neutral GPU metrics on Windows: PDH performance counters give
# per-engine utilization + dedicated VRAM usage for any WDDM adapter (AMD,
# Intel, NVIDIA); DXGI reports total VRAM and the adapter name.
[target.'cfg(windows)'.dependencies]
# The caller that needed this (fresh PATH resolution from the registry,
# so CLIs installed while loomux is already running are still found by new
# panes and probes) moved whole into crates/loomux-engine (#888 slice A4
# batch 13, which declares the same version there). `grep -rn winreg
# src-tauri/src/` finds nothing but that fact — no code here calls it.
# Retained rather than removed: dropping it is a separate cleanup this batch
# didn't take, not a claim that something here still needs it. Pure
# windows-sys underneath — no getrandom (see note above) — so it is harmless
# either way.
winreg = "0.55"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Kill-on-close Job Objects (issue #78): a spawned pane's whole process
    # subtree dies deterministically when its pane is killed/closed. Security
    # is only pulled for CreateJobObjectW's SECURITY_ATTRIBUTES arg (we pass
    # null); Threading for OpenProcess + the extended-limit-info struct.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    # File-manager pane (#214). Two Shell APIs, NO new crate — which is the whole
    # point of reaching for the `windows` crate we already depend on rather than
    # `tauri-plugin-opener` or the `trash` crate:
    #   ShellExecuteW    — "open with the OS default app for this extension",
    #                      exactly what Explorer's double-click does. Takes a path,
    #                      never a shell string, so there is no injection surface
    #                      (cf. `cmd /c start`, which re-parses its argument).
    #   SHFileOperationW — delete to the RECYCLE BIN (FO_DELETE | FOF_ALLOWUNDO),
    #                      so a mis-click is recoverable. The `trash` crate would
    #                      have done this too, but it is an unvetted dependency and
    #                      this is ~30 lines against an API we already link.
    # WindowsAndMessaging is pulled only for ShellExecuteW's SHOW_WINDOW_CMD arg.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # COM apartment init for the delete WORKER thread (#216). SHFileOperationW is a shell
    # API and documents a COM requirement; the main thread satisfies it only because wry
    # already OleInitialize'd it as an STA. Move the call to a worker and the worker must
    # enter its own apartment — CoInitializeEx(COINIT_APARTMENTTHREADED) / CoUninitialize,
    # RAII-guarded. That is the whole reason this was NOT a naive `async fn`. See
    # `filemgr::ComApartment` and doc/design/files-pane.md.
    "Win32_System_Com",
] }

# Voice-prompt prototype (#58): native mic capture via WASAPI. Windows-scoped on
# purpose — cpal pulls alsa-sys on Linux (needs libasound2-dev, which the CI
# runners lack) and coreaudio on macOS, but the feature's transcription path is
# Windows-flavoured (whisper-cli.exe, %LOCALAPPDATA%). Keeping it under the
# windows cfg means Linux/macOS builds don't drag in ALSA/CoreAudio, and the
# voice module is stubbed there to return a graceful "not available" error.
#
# cpal was vetted with `cargo tree -i getrandom` — getrandom appears ONLY as a
# build-dependency (jobserver→cc) or Android-only oboe-sys, never in cpal's
# Windows runtime tree, so it does NOT import ProcessPrng and is safe on the
# Windows 10 baseline (see the getrandom note above). Pure Rust WASAPI bindings,
# no C++/cmake build. Transcription shells out to a prebuilt whisper.cpp binary
# (see src/voice.rs) rather than linking whisper-rs, which WOULD pull a
# cmake/MSVC C++ build into `cargo check`. This is a prototype (issue #58).
cpal = "0.15"

[dev-dependencies]
# default-features = false drops tempfile's getrandom feature — see the
# ProcessPrng note above; with it enabled the test binary fails to load.
tempfile = { version = "3", default-features = false }
# The Job-Object integration test (issue #78) opens a real ConPTY exactly the
# way spawn_pty does; portable-pty is already in the main tree (getrandom-free).
portable-pty = "0.9"
# ACL coherence test (#363): the "test" feature is a pure code-gate (empty
# feature deps, see tauri's Cargo.toml) that unlocks `tauri::test`'s
# MockRuntime + IPC harness, letting tests/acl_manifest.rs exercise the
# REAL resolved capability graph (our actual capabilities/permissions on
# disk, via the same generate_context! build.rs already feeds) headlessly.
# Dev-only: cargo's per-target feature unification keeps this out of the
# shipped binary. No new crate — tauri is already a normal dependency.
tauri = { version = "2", features = ["test"] }

# Liveness tests (#1607, epic #1600 Phase 2.3): `tests/liveness.rs` L3a builds a
# tokio runtime with `max_blocking_threads(2)` and installs it via
# `tauri::async_runtime::set`, so the blocking pool the app shares can be
# SATURATED deterministically — two parked tasks instead of the 512 beta6 needed.
# That is the only way to ask the question 2.3 is about ("does a keystroke still
# land when the pool is full?") without a 512-thread test.
#
# NO NEW PACKAGE, and no getrandom exposure. `tokio` is already in Cargo.lock as
# tauri's own normal dependency (v1.52.3) — `tauri::async_runtime` is a re-export
# of it — so this line adds a direct edge to a crate the shipped binary already
# links, not a crate. It is also a DEV-dependency, which per the audit rules
# stated above ("what the ban actually tests") can never reach orrerix.exe's
# load-time imports whatever it pulled. `default-features = false` plus the one
# feature the test needs keeps even the dev graph from widening: `rt-multi-thread`
# brings the scheduler and nothing else (no `net`, no `time`, no `process`), and
# `sync` is not requested because tauri already enables it — the reply channel
# `tauri::async_runtime::channel` hands out is tokio's, reached through the
# re-export rather than through this line.
#
# THE EVIDENCE, measured where an agent worker can measure it — Cargo.lock, not
# `cargo tree` (local cargo is banned in this repo, see CLAUDE.md; a tree quoted
# from memory would be a fabricated audit). `Cargo.lock`'s `tokio` entry is
# v1.52.3 and its `dependencies` list is, in full:
#
#   bytes, libc, mio, pin-project-lite, socket2, windows-sys 0.61.2
#
# No getrandom, and every one of those six is ALREADY a lock entry via tauri.
# The lock records the union of a package's possible dependencies rather than a
# feature-resolved set (the disagreement `rusqlite`'s note above warns about),
# which makes it the CONSERVATIVE instrument here: the real graph under
# `default-features = false` is a subset of what is listed. The only Cargo.lock
# change this line makes is one word — `"tokio"` joining the `orrerix` package's
# own dependency list, between `tiny_http` and `windows`.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }

# `[profile.release]` USED TO BE HERE and is now in the workspace-root
# Cargo.toml (#888 slice A1). Cargo reads profiles from the root manifest only
# and merely WARNS about a profile in a member, so leaving it here would have
# silently dropped lto/codegen-units and the symbolicated-backtrace settings
# (#53) from every release build. Don't move it back; see the root Cargo.toml
# and doc/design/engine-extraction.md.
