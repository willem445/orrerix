# Jekyll configuration for the Orrerix documentation site.
#
# Tooling decision (see docs/README.md for the full rationale): this is a
# GitHub-Pages-native Jekyll site — plain checked-in Markdown plus this config,
# with *no* package.json, Gemfile, or other repo-local toolchain to maintain.
# The `just-the-docs` theme (pinned below) is pulled in as a remote theme by
# `actions/jekyll-build-pages` in .github/workflows/docs.yml, so there is
# nothing to install, pin in a lockfile, or keep patched in this repo.

title: Orrerix
description: >-
  A dead-simple terminal multiplexer for AI agent management — instant matrix
  splits, native agent-session restore, and a built-in orchestrator/worker
  workflow.

# Project-pages hosting: https://willem445.github.io/orrerix/
url: https://willem445.github.io
baseurl: /orrerix

# Theme is fetched at build time by the github-pages gem's jekyll-remote-theme
# plugin (bundled into actions/jekyll-build-pages). Pinned to a release tag so a
# theme change upstream can never silently break a release-day publish; bump the
# tag deliberately. See https://just-the-docs.com for theme options.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# just-the-docs options.
search_enabled: true
heading_anchors: true
color_scheme: dark

aux_links:
  "Orrerix on GitHub":
    - "https://github.com/willem445/orrerix"
aux_links_new_tab: true

nav_external_links:
  - title: Download the latest release
    url: https://github.com/willem445/orrerix/releases/latest

footer_content: >-
  Orrerix is MIT-licensed. This site documents what ships on
  <code>main</code>; the source of truth is the code.

# Keep Jekyll from trying to render repo scaffolding as pages.
#
# `design/` and `plans/` are INTERNAL notes, folded in here by #3315 so the repo
# has one documentation root instead of two (`doc/` and `docs/`). They are
# excluded from the build deliberately: they are written for contributors and
# agents — arguments, residuals, issue numbers, "what we rejected and why" — and
# publishing ~85 of them would triple the site and bury the dozen pages a user
# actually wants behind internal engineering prose. Publishing them under a
# "Design" nav section is a perfectly reasonable ALTERNATIVE, but it is a
# product decision about what orrerix's site is for, and it has not been made;
# excluding is the choice that changes nothing for a reader today. Flipping it
# later is this block plus front matter on each page.
exclude:
  - README.md
  - design/
  - plans/
