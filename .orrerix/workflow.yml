# ROSTER (active since 2026-08-29 at the human's request; revised
# 2026-08-30 after the first ~20 GLM jobs). The previous dogfood roster is
# .orrerix/workflow.yml.orig — swap the two names back to restore it. Turn the
# advanced orchestrator on (or off-then-on) in the launcher and READ THE
# RESOLVED-ROSTER PREVIEW before anything spawns.
#
# Shape: pi + OpenRouter GLM 5.3 Flash (thinking high for both tiers — GLM 5.3 Flash on OpenRouter supports only low|high|max and pi clamps upward, #2938) is the default worker and the
# iterating reviewer; Claude Code Opus is the fallback worker (rule 3) and the
# final validator. Orchestrator = Claude Opus, planner = Claude Fable.
#
# THE THREE ROUTING RULES (2026-08-30 revision — each one is a measured cost):
#
#  1. SEQUENCE THE LANES, never run them in parallel. rev-std iterates with the
#     worker until it records PASS and the PR body is FINAL (every body edit
#     re-stales both lanes, so body fixes are batched BEFORE the final record).
#     Only then is rev-final spawned, ONCE, at that head. If rev-final blocks:
#     worker fixes -> rev-std re-records (cheap) -> ONE rev-final delta.
#     Measured: run in parallel, rev-final was resumed 3-4x per PR for rounds
#     that were pure re-verification (#1764: four Opus deltas for body receipts).
#     DEFER RULE (human decision q-38, #2168): when every required lane has
#     passed and the only open findings are non-blocking, at review round >= 2
#     the orchestrator DEFERS them (reason, a line in the PR's disposition
#     comment, one line to the human -- not a new issue, #3441) instead of
#     routing another round -- UNLESS a
#     finding names a defect: a wrong value, an unreachable arm, a claim the
#     code contradicts. Those route as blocking. Round-1 non-blocking findings
#     are still fixed in the PR. (#2168)
#
#  2. ROUTE BY DIFF SHAPE (gates.merge.routing below, #1176). The static gate is
#     rev-std alone; rev-final is REQUIRED only when the diff touches code, tests,
#     CI, dependency manifests, the fixture-pinned role templates, or a design
#     note under docs/design/. A prose-only PR (CLAUDE.md, .claude/,
#     .github/agents/, .orrerix/, and docs/ OUTSIDE docs/design/) merges on rev-std
#     PASS + the orchestrator's own disposition. Routing is additive by
#     construction (a rule can add a lane, never remove one), and `*` crosses
#     `/`, so a rule over-matches rather than under-matches.
#     Measured: about half of one session's PRs were prose-only and each still
#     paid an Opus final pass.
#
#  3. DEFAULT EVERY TASK TO worker-std (the human's standing directive).
#     worker-adv is used ONLY when (a) a worker-std has tried the task and
#     failed -- reported blocked, or failed the same review finding twice --
#     briefed fresh, never resumed; or (b) the task is extremely complex, and
#     the brief says why. Design content or claim density alone is not enough:
#     try worker-std first and let the review loop catch what it misses.
#
# CALIBRATION RULE (human, 2026-08-29): rev-final's "review findings" section is
# the signal. Track per PR whether rev-final found a BLOCKING issue rev-std
# missed. Trial 1 (2026-08-29): 2 of 2 PRs. Trial 2 (2026-08-30): every code PR
# so far had a blocking miss in one direction or the other (counter = 0). When
# three consecutive CODE PRs show none, propose dropping rev-final from the
# routing rules below; until then it stays.
#
# 2026-08-30, #1782 (S0 design note of #1778) -- the data point that ADDED the
# docs/design/** routing rule. rev-std ran two rounds and recorded PASS with 0
# open findings; rev-final then found 8 blocking + 12 non-blocking in the same
# note, and the merge gate read SATISFIED throughout because rev-final was not
# a required lane for that path. The characterization to keep: rev-std verified
# that 30/30 cited symbols EXIST; it did not verify they BEHAVE as cited, and
# the false-behaviour class it caught once survived in four more places.
#
# What this file cannot say, and where it lives instead:
#  * The orchestrator's brief discipline for the cheap model (very literal
#    prompts — exact files, exact commands, exact acceptance checks, "prove
#    every claim with a command + its output"; PR bodies carry the diffstat and
#    run ids, not derived receipts) CANNOT go here: a repo file may pin the
#    orchestrator's cli/model only (workflow.md invariant 5). It lives in
#    .orrerix/lessons.md (auto-injected into every orchestrator kickoff) — the
#    entry is at the bottom of this file. The routing rules above are carried
#    by the block NAMES the orchestrator sees in its roster, by the edges, and
#    by the gate.
#  * OpenRouter auth is the human's, and it is PER CLI: pi reads its own
#    `auth.json` under pi's config dir (relocatable via `PI_CODING_AGENT_DIR`,
#    kept separate from `OPENCODE_CONFIG_DIR`; docs/design/pi.md). Configure
#    OpenRouter auth for pi before launching the cheap tier, and confirm with
#    `pi --list-models` - it prints only models whose auth is configured, so
#    an unauthed pi silently offers nothing. loomux passes
#    `--model openrouter/z-ai/glm-5.3-flash` (verified against
#    https://openrouter.ai/api/v1/models on 2026-08-29: id
#    `z-ai/glm-5.3-flash`, 1.3M ctx, $0.075/M in, $0.25/M out).
#  * effort:/context: are not settable on opencode blocks (CLI_CAPS); on the
#    claude blocks they are left at the CLI default.
#  * "Once" is a routing intent, not a mechanism: a verdict is bound to the
#    commit AND body it reviewed, so a push or a body edit after rev-final's
#    PASS is a second call by construction. Rule 1 is what keeps that to one.

version: 1
name: loomux-cheap-tier

# rustfmt can use 16–23 GB on large modules; serialize it across workers.
# This advisory lock prevents concurrent runs from exhausting machine memory.
resources:
  rustfmt: { slots: 1, max_hold_minutes: 10 }

merge_queue:
  enabled: false
  max_batch: 3
  checks_timeout_minutes: 60

# S5 dogfood (#1778), enabled by the human 2026-08-31 on v1.3.0-beta3 - the first
# build where the driver actually runs. Enables the mechanism only: no drive exists
# until the orchestrator makes a role-gated drive_review call naming ONE PR.
# Counters left at their defaults, which are INVARIANT 9s ceilings: 3 review rounds,
# 3 CI attempts, 1 rebase, 60/60/240 minute timeouts. A value outside a range refuses
# the WHOLE file, gates and roster included; do not hand-tune before a first run.
# Known gap while dogfooding: #1857 (a kick-back notice reaching no pane has no
# re-delivery). Set enabled: false to turn it off; absent and false are equivalent.
driver:
  enabled: true

# S1 dogfood (#3304). An orchestrator wake costs ~1.3 M cache-read tokens, and the
# census over this group's own log found 64 % of 368 wakes closing by the LEADING
# SHAPE of the notice with no judgement in them. With this on, those are recorded
# instead of typed into the pane, and flushed as ONE framed line at the next
# delivery that DID need it, or at max_defer_minutes. Nothing is dropped:
# list_deferred() reads what is held, and every deferral is on audit.jsonl as
# delivery-triaged. Fail-safe is DELIVER - a shape the rules do not positively
# recognise wakes the pane exactly as before, and a HELD drive, a blocked report,
# a watchdog stall, a re-grounding notice and anything naming the orchestrator are
# never triaged at all.
#
# provider: none is the ONLY value this build accepts, and it is the whole of the
# privacy posture: no text leaves this machine - nothing on the delivery path
# makes a network call. A provider adapter is #3304 S3 and is held on a measured agreement
# run. kinds and max_defer_minutes are left at their defaults (every kind the rule
# table covers; 30 minutes). Set enabled: false to turn it off; absent and false
# are equivalent.
triage:
  enabled: true
  provider: none

blocks:
  - id: orchestrator
    name: Orchestrator
    kind: orchestrator
    cli: claude
    model: opus

  - id: planner
    name: Planner
    kind: planner
    cli: claude
    model: opus

  # -- worker tiers: worker-std by default; worker-adv only per rule 3 ------------
  - id: worker-std
    name: "Standard worker (DEFAULT for every task - pi GPT-6 Luna. Route here first, including design-shaped and evidence-heavy work)"
    kind: worker
    cli: claude
    model: sonnet
    effort: high
    profile: .github/agents/worker-std.md

  - id: worker-adv
    name: "Advanced worker (Opus - ONLY after a worker-std tried the task and failed, or for an extremely complex task; name the reason in the brief)"
    kind: worker
    cli: pi
    model: openai-codex/gpt-6-luna
    effort: medium
    profile: .github/agents/worker-deep.md

  # -- review lanes: rev-std runs every round; rev-final ONCE, last, code PRs only
  - id: rev-final
    name: "Final validation (ONCE, LAST, after rev-std PASSED on the final body - Opus; required on code PRs only, see gates.merge.routing)"
    kind: reviewer
    cli: claude
    model: opus
    profile: .orrerix/personas/rev-final.md

  - id: rev-std
    name: "Standard review (EVERY ROUND - pi GPT-6 Luna; round 1 measures the WHOLE diff, later rounds the scope line the brief names; every finding must carry a repro; iterate to PASS with a FINAL body)"
    kind: reviewer
    cli: claude
    model: sonnet
    effort: high
    profile: .github/agents/rev-std.md

# ADVISORY: the intended path. worker-std by default (rule 3); rev-std runs
# every round; rev-final once, after rev-std's PASS on the final body (rule 1).
edges:
  - { from: orchestrator, to: [planner, worker-std, worker-adv] }
  - { from: planner, to: [worker-std, worker-adv] }
  - { from: worker-std, to: [worker-adv, rev-std] }
  - { from: worker-adv, to: rev-std }
  - { from: rev-std, to: rev-final }

# ENFORCED: rev-std must record PASS on the merged head + body on every PR;
# rev-final is ADDED to the required set when the diff touches anything a
# prose review cannot judge (rule 2). Routing is a union — a rule can only add.
gates:
  merge:
    require: all-pass
    reviewers: [rev-std]
    routing:
      # application code, tests, the E2E lane, the launcher
      - paths: ["src/**", "src-tauri/**", "crates/**", "test/**", "e2e/**", "scripts/**", "npm/**", "**/*.rs"]
        reviewers: [rev-final]
      # design notes that FIX a public contract later slices build against.
      # Evidenced: #1782 (S0 of #1778) passed rev-std with 0 open findings and
      # rev-final then found 8 blocking + 12 non-blocking in the same note --
      # rev-std verified the cited symbols EXIST, not that they BEHAVE as cited.
      - paths: ["docs/design/**"]
        reviewers: [rev-final]
      # CI and release pipelines
      - paths: ["**/.github/workflows/*.yml"]
        reviewers: [rev-final]
      # dependency manifests (CLAUDE.md constraint 2: no getrandom-based crates)
      - paths: ["**/Cargo.toml", "Cargo.lock", "package.json", "package-lock.json"]
        reviewers: [rev-final]
    also: [ci-green]

# -----------------------------------------------------------------------------
# .orrerix/lessons.md ENTRY (keep in step with the rules above; ~800 bytes —
# the injected tail is capped at ~4 KB, so it evicts the oldest unpinned entry):
#
# ## Cheap-tier roster: literal briefs, sequenced lanes, worker-std by default
# When the roster carries `worker-std`/`rev-std` (pi + GLM Flash):
# 1. A brief names EXACT files and functions, the EXACT commands to run and the
#    EXACT output that means done; one task, no judgment calls left open; grep
#    every anchor before briefing. PR bodies carry the diffstat and run ids —
#    no derived receipts (each one costs a review round).
# 2. Every claim in a report/PR body must quote the command and its output;
#    a claim with no output is a failure, not a nit.
# 3. Default every task to worker-std. worker-adv ONLY after a worker-std has
#    tried and failed (blocked, or the same finding failed twice -- briefed
#    fresh, never resumed), or for an extremely complex task, with the reason
#    named in the brief.
# 4. rev-std runs every round, to PASS on a FINAL body (batch body edits before
#    the record). rev-final is spawned ONCE, last, only then — and only where
#    the gate's routing requires it (code, tests, CI, manifests).
