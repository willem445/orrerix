[[set]]
identifier = "orch-control"
description = "Mutating orchestration operations: create/bind/steer/approve/grant-merge/grant-release, answering and dismissing the human questions agents raise, resolving, dismissing and clearing the needs-you items they raise, task and channel management, autonomy settings, applying a named workflow to a live group, group lifecycle, solo panes, lead panes."
