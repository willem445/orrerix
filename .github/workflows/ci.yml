name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dry-run instrument for #2128 slice C (#2138 slice A). Running the
  # code-metrics report over a list of arbitrary commits is how a proposed gate's
  # false-block count gets measured over already-merged PRs BEFORE the gate is
  # armed — CLAUDE.md's "a guard that REFUSES ships only after it has run clean
  # over known-good subjects", mechanised. Nothing else on this workflow runs for
  # a dispatch: `plan` is gated off below, so `build` and `e2e-windows` are
  # skipped with it.
  workflow_dispatch:
    inputs:
      shas:
        description: "Commits to report on (space- or comma-separated). Leave empty to do nothing."
        required: false
        default: ""
      clippy:
        description: "Also run clippy on each commit (slow; Rust rows are n/a without it)."
        type: boolean
        required: false
        default: false

jobs:
  # [scratch]-titled PRs (red-before-green counterfactuals,
  # never merged; convention, not enforced: a skipped E2E
  # reads green at every gate) run one platform
  # and no E2E (#1685).
  plan:
    # A `workflow_dispatch` is the code-metrics dry-run (see `on:` above), not a
    # build. Gating the gate job here rather than on `build` and `e2e-windows`
    # separately keeps it one line: both `needs: plan`, so both skip with it.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      scratch: ${{ steps.decide.outputs.scratch }}
      platforms: ${{ steps.decide.outputs.platforms }}
    steps:
      - id: decide
        run: |
          SCRATCH="${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[scratch') }}"
          if [ "$SCRATCH" = "true" ]; then
            PLATFORMS='["ubuntu-22.04"]'
          else
            PLATFORMS='["ubuntu-22.04","windows-latest","macos-latest"]'
          fi
          # fromJSON below parses this string at matrix-expansion time; a malformed
          # literal would surface there as an expression error on a job with no
          # steps, so fail loud here instead (#1755 premortem 1).
          printf '%s' "$PLATFORMS" | jq -e . >/dev/null
          echo "scratch=$SCRATCH" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fast mechanical backstop for release bumps (#274): the seven version
      # fields across six files (package.json, package-lock.json x2,
      # npm/package.json, tauri.conf.json, Cargo.toml, Cargo.lock) must all
      # agree. v0.8.0 shipped with a stale package-lock.json (#224) because
      # that check was checklist-only — fail the build on drift instead.
      - name: Check version consistency
        run: node scripts/check-versions.js

      - uses: dtolnay/rust-toolchain@stable
        with:
          # This action installs with `--profile minimal`, which does NOT include
          # clippy. The code-metrics step below is the only thing in this job that
          # needs it (#2138).
          components: clippy

      # `.` since #888 slice A1: the Cargo workspace root is the repo root, so
      # that is where Cargo.lock and target/ live. Pointing this at src-tauri
      # would cache a directory that no longer holds either, i.e. cache
      # nothing, silently and slowly.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (typecheck + bundle)
        run: npm run build

      # `npm run build`'s tsc pass only covers `src/` (tsconfig.json's
      # `include`) — e2e/ has its own tsconfig.json (Node + Playwright types)
      # and was never typechecked at all until #1333. Root tsconfig.json pins
      # `"types": []` so installing @types/node for e2e/ can't auto-widen
      # src/'s DOM-only program with Node's ambient globals (constraint 5;
      # #1428 review B1) — the seam is enforced there, not by this being a
      # separate tsconfig. A plain `tsc -p` run over 10 small spec files adds
      # a couple of seconds per platform, not a new dependency install or a
      # new job.
      - name: Typecheck e2e specs
        run: npm run typecheck:e2e

      # `npm run build` above is a typecheck, not a test run — the frontend suite
      # (node:test over `test/**/*.test.ts`) was never gated by CI at all, so a
      # regression in a pure module merged green as long as it still typechecked.
      # That includes the pin on the repo's OWN `.orrerix/workflow.yml` (#222), which
      # is only worth having if it runs on every PR.
      - name: Test frontend
        run: npm test

      # `--workspace`, and run from the repo root, since #888 slice A1. Without
      # the flag cargo would build only the package whose directory it was
      # invoked in, so `crates/loomux-engine` would never be compiled by CI at
      # all and a broken engine manifest could merge green.
      - name: Check backend
        run: cargo check --locked --workspace

      # ----- code metrics, per-leg clippy pass (#2138 slice A) -----------------
      #
      # REPORT-ONLY, AND STRUCTURALLY UNABLE TO FAIL THE BUILD. Both steps are
      # `continue-on-error`, neither is depended on by anything in this job, and the
      # parser downstream turns an unreadable message into a MISSING row rather than
      # a number. If clippy will not run at all, the Rust half of the report is
      # marked unavailable and the job carries on.
      #
      # ON EVERY LEG, on purpose. A `cfg(windows)` body is invisible to a clippy run
      # on ubuntu, so a single-leg measurement would silently under-report exactly
      # the platform-specific code this project has most of. The report job merges
      # the legs and keeps the larger value per function. If this ever costs more
      # than it is worth on a leg, the honest fix is to drop that leg AND record in
      # `docs/design/code-metrics.md` that its `cfg` bodies are unmetered — not to
      # leave the merged number looking complete.
      #
      # `CLIPPY_CONF_DIR` is scoped to this step, so `.github/clippy/clippy.toml`'s
      # thresholds-of-1 never reach `cargo check`, `cargo test`, or anyone's local
      # clippy. `--force-warn` rather than `-W`: these lints are allow-by-default,
      # and 20 `allow(clippy::…)` attributes in the tree would otherwise leave their
      # functions unmeasured (#2128 part 3).
      #
      # No `pipefail`: clippy's exit status is deliberately discarded. This step
      # reports on warnings, it does not enforce them.
      - name: Code metrics — clippy pass (report-only, #2138)
        continue-on-error: true
        shell: bash
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy
        run: |
          set +e
          start=$(date +%s)
          cargo clippy --locked --workspace --message-format=json --quiet -- \
            --force-warn clippy::too_many_lines \
            --force-warn clippy::cognitive_complexity \
            --force-warn clippy::too_many_arguments \
            --force-warn clippy::unwrap_used \
            --force-warn clippy::expect_used \
            --force-warn clippy::panic \
            | node scripts/code-metrics.cjs clippy \
                --platform "${{ matrix.platform }}" \
                --repo-root . \
                --out "clippy-metrics-${{ matrix.platform }}.json"
          echo "code-metrics: clippy leg ${{ matrix.platform }} took $(( $(date +%s) - start ))s"

      - name: Code metrics — upload this leg's clippy numbers
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics-clippy-${{ matrix.platform }}
          path: clippy-metrics-${{ matrix.platform }}.json
          if-no-files-found: ignore
          retention-days: 30
      # ----- end code metrics (#2138 slice A) ---------------------------------

      # #464: a whole-suite backstop the backend tests themselves can't
      # provide. A test can pin its OWN fixture's cleanup, but nothing
      # inside `cargo test` can pin "no OTHER test, now or in the future,
      # leaves a git-worktree fixture behind" — the harness runs tests in
      # parallel with no defined "runs after everything else" hook, and this
      # repo has several separate integration-test BINARIES (orchestration,
      # workflow, lessonsfile, prompts, ...), each its own process, so an
      # in-suite check can only ever see its own binary. A before/after
      # count at the JOB level sees all of them in one shot, on the same
      # isolated runner filesystem this job already owns exclusively.
      # Scoped to `*-worktrees` specifically (loomux's own naming
      # convention — `git_worktree_add` in src/git.rs) rather than any
      # `%TEMP%` growth at all: many other tools (npm, tauri, rustc) write
      # their own temp files during this same job, and a generic "did
      # %TEMP% grow" check would be constant false-positive noise.
      - name: Snapshot temp-dir worktree-fixture baseline (#464)
        shell: bash
        run: |
          set -euo pipefail
          root="${TMPDIR:-${TEMP:-${TMP:-/tmp}}}"
          echo "LOOMUX_LEAK_TEMPROOT=$root" >> "$GITHUB_ENV"
          count=$(find "$root" -maxdepth 1 -iname '*-worktrees' 2>/dev/null | wc -l | tr -d ' ')
          echo "LOOMUX_LEAK_BASELINE=$count" >> "$GITHUB_ENV"

      - name: Test backend
        run: cargo test --locked --workspace --no-fail-fast

      - name: Verify the backend test suite left no worktree fixtures behind (#464)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # if: always() means this step also runs when an earlier step in
          # the job (e.g. "Test frontend") fails before the snapshot step
          # above gets to export LOOMUX_LEAK_TEMPROOT/_BASELINE — or when
          # the snapshot step itself dies between its two GITHUB_ENV writes
          # (e.g. `find` failing under `pipefail` after TEMPROOT is written
          # but before BASELINE is). Guard both reads so either cascade
          # produces the real failure's error, not a second, unrelated
          # "unbound variable" one (#690). When the baseline step DID run,
          # this is a no-op and the check below is unchanged.
          if [ -z "${LOOMUX_LEAK_TEMPROOT:-}" ] || [ -z "${LOOMUX_LEAK_BASELINE:-}" ]; then
            echo "skipping leak check: LOOMUX_LEAK_TEMPROOT/_BASELINE unset — an earlier step failed before the baseline snapshot completed (#690)"
            exit 0
          fi
          after="$(find "$LOOMUX_LEAK_TEMPROOT" -maxdepth 1 -iname '*-worktrees' 2>/dev/null || true)"
          count=$(printf '%s\n' "$after" | grep -c . || true)
          if [ "$count" -gt "$LOOMUX_LEAK_BASELINE" ]; then
            echo "::error::cargo test left $((count - LOOMUX_LEAK_BASELINE)) new '*-worktrees' director$([ $((count - LOOMUX_LEAK_BASELINE)) = 1 ] && echo y || echo ies) behind under $LOOMUX_LEAK_TEMPROOT — a test fixture is leaking a real git worktree (#464). New entries:"
            printf '%s\n' "$after"
            exit 1
          fi
          echo "ok: no new worktree-fixture leaks (baseline $LOOMUX_LEAK_BASELINE, now $count)"

  # E2E PoC (spike, docs/design/e2e-testing.md): drives the real WebView2
  # webview over CDP (Playwright's native WebView2 support). Windows-only —
  # that's the only platform CDP-over-WebView2 covers, and it's this project's
  # Windows-10 baseline anyway. Runs against an isolated profile
  # (`tauri.e2e.conf.json`'s `dev.orrerix.e2e` identifier + `ORRERIX_DATA_DIR`),
  # never a real install (issue #394 overlap — see e2e/fixtures.ts).
  # continue-on-error while flakiness is unknown: this must never red the
  # merge gate on its own — drop it once the suite has a track record.
  e2e-windows:
    name: E2E (Playwright, experimental)
    needs: plan
    if: needs.plan.outputs.scratch != 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # See the note on the build job's copy: workspace root is the repo root.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (E2E identifier, unbundled debug build)
        run: npx tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json

      # GitHub-hosted windows-latest runs jobs at High integrity level, and
      # WebView2 Runtime 150+ intentionally drops the WEBVIEW2_* env-var and
      # HKCU-policy channels for an elevated host process as local-privilege-
      # escalation hardening — by design, not a bug
      # (MicrosoftEdge/WebView2Feedback#5640, closed as completed 2026-07-09;
      # see docs/design/e2e-testing.md "CI status"). The one channel Microsoft
      # names as surviving elevation is an HKLM policy — set it here, machine-
      # wide, before launching: this is CI-only config on an ephemeral runner
      # VM, nothing in product code, and nothing to clean up (the VM is
      # destroyed after the job regardless). Must match e2e/fixtures.ts's
      # `CDP_PORT` default (LOOMUX_E2E_CDP_PORT if overridden).
      #
      # `AdditionalBrowserArguments` isn't itself in Microsoft's *published*
      # WebView2 policy reference (learn.microsoft.com/deployedge/
      # microsoft-edge-webview-policies only lists BrowserExecutableFolder,
      # ChannelSearchKind, DowngradeVersion, ReleaseChannel{Preference,s}) --
      # the maintainer's fix comment named it without the registry shape. All
      # of those *published*, structurally-identical "Loader Override
      # Settings" policies share one convention: the policy name is a KEY, not
      # a value, containing one Value-Name/Value pair per app (Value Name =
      # exe name or AUMID, or "*" for all apps) -- e.g.
      # `...\WebView2\BrowserExecutableFolder` with value name "*" and the
      # folder path as the data. This follows that same documented shape.
      - name: Set WebView2 HKLM policy (survives High-IL, unlike the env var)
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" `
            -Name "orrerix.exe" -Value "--remote-debugging-port=9333 --disable-gpu" -Type String

      - name: Run Playwright E2E suite
        run: npx playwright test
        env:
          # Soak-lane budget (#1603, plan #1600 §3 Phase 4.1). Stated here
          # rather than left to e2e/liveness.ts's defaults so the cost of
          # this job is visible where the job is, and tunable without a
          # code change. 180 s is ~45 ticks of src/tabbar.ts's 4 s status
          # poll. That was many dozens of poll invokes when this budget was
          # set (two per group-bound tab); since #1608 the sweep is one
          # orch_strip_view per tick, so ~45 for the whole soak. The scale
          # plan #1600 asks for is now carried by the corpus and the
          # lock-hold injector rather than by the invoke count. The hold has to outlast both
          # probes, which need ~70 s worst case at these bounds.
          #
          # MEASURED, not estimated, at f6f41833 (run 33235203093): soak
          # 3.3 m + armed/single-flight/watchdog control 17.6 s + class
          # assertion 48.6 s = ~4.4 min of a 5.5 min suite, inside a 9m22s
          # job whose remainder is mostly the debug `tauri build`. A retry
          # of the soak spec adds ~3.3 min. Raising these knobs is what a
          # long local soak does; see docs/design/e2e-testing.md "The soak
          # lane".
          ORRERIX_SOAK_MS: "180000"
          ORRERIX_SOAK_LOCK_HOLD_MS: "90000"
          ORRERIX_SOAK_BOUND_MS: "20000"
          # Workspace-root target/ since #888 slice A1 — cargo puts every
          # member's build output in the ROOT target dir, so the exe is no
          # longer under src-tauri/. Must stay in step with e2e/fixtures.ts's
          # DEFAULT_EXE, which is what runs when this env var is unset;
          # test/workspacelayout.test.ts pins that the two agree.
          LOOMUX_E2E_EXE: ${{ github.workspace }}\target\debug\orrerix.exe

      # If the suite above failed, surface a pointer to the debugging docs in
      # the job output itself — not just in a comment nobody reading the
      # failed run sees. The HKLM policy fix (above) is confirmed working, so
      # a red run here is most likely a real spec/app problem now, not the
      # runner's execution context — this is a pointer to check, not a
      # default explanation. See docs/design/e2e-testing.md "CI status".
      - name: Note where to start debugging a red run
        if: failure()
        run: |
          echo "::warning::e2e-windows failed. This job is continue-on-error and does not gate merges, but treat this as a real signal first -- the CI-side HKLM policy workaround for WebView2's High-IL restriction is confirmed working (see docs/design/e2e-testing.md 'CI status'), so a red run here is unlikely to be that issue recurring. Check the specs/app first."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ===== Code metrics report (#2138 slice A) ================================
  #
  # WHAT THIS IS. A REPORT on the shape of this repo's own code — function
  # lengths, nesting, argument counts, TypeScript import cycles, exports nobody
  # imports, comment share per root, and `orchestration/mod.rs`'s line count. It
  # produces `code-metrics.json` (an artifact) and a job summary. It is the
  # instrument #2128 part 8 asks for: the distributions have to EXIST before any
  # threshold can honestly be chosen.
  #
  # IT CANNOT TURN CI RED ON A METRIC. Every step is `continue-on-error`, no
  # threshold is compared against anything, and nothing in the merge gate depends
  # on this job. That is the acceptance criterion of the slice, not a nicety.
  #
  # WHY A SEPARATE JOB. The clippy numbers are measured per build leg (a
  # `cfg(windows)` body is invisible on ubuntu) and the legs are separate matrix
  # jobs, so the merge has to happen somewhere that can see all of them. This job
  # downloads each leg's artifact and merges them.
  code-metrics:
    name: Code metrics (report-only)
    needs: build
    # Runs even when a build leg went red: the report is diagnostic, and a leg that
    # failed after its clippy step still uploaded usable numbers. Skipped only when
    # `build` itself was skipped (a `workflow_dispatch`, handled by its own job
    # below) or the run was cancelled.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-22.04
    # Scoped to what the delta comment needs and nothing else (#2128 part 6d):
    # `pull-requests: write` to post and edit the one sticky comment, `actions:
    # read` to find the base commit's run and download its artifact, `contents:
    # read` for the checkout. ci.yml declares no other job scopes; these PRs come
    # from same-repo branches, so the token is not the read-only fork variant.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # The PR's own head, not the merge commit checkout@v4 defaults to on a
      # pull_request: every number this job prints is dated to a SHA, and that SHA
      # has to be one a reader can check out.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `typescript` is a devDependency and the compiler API is the whole TS half
      # of the script. No new dependency is installed here or anywhere in #2138.
      - name: Install frontend dependencies
        run: npm ci

      - name: Download each build leg's clippy numbers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: code-metrics-clippy-*
          path: clippy-legs

      - name: Build the report
        id: report
        continue-on-error: true
        shell: bash
        run: |
          set -u
          legs=()
          while IFS= read -r f; do
            legs+=(--clippy "$f")
          done < <(find clippy-legs -name '*.json' 2>/dev/null | sort)
          echo "code-metrics: ${#legs[@]} clippy leg argument(s)"
          node scripts/code-metrics.cjs report \
            --repo-root . \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --ref "${{ github.ref_name }}" \
            "${legs[@]}" \
            --out code-metrics.json \
            --summary "$GITHUB_STEP_SUMMARY"


      # ----- the per-PR delta comment (#2138 slice B) --------------------------
      #
      # NEVER FAILS ON A MISSING BASE. Three arms, in order: the base SHA's own
      # stored `code-metrics.json` artifact; a second measurement taken on a
      # worktree checked out at the base; and `n/a`, which the comment prints as
      # "base unavailable" instead of a guess. Every step here is
      # `continue-on-error` on top of that, so B cannot red a build any more than A
      # can.
      #
      # BOTH SIDES ARE MEASURED. The comment never derives a base figure by
      # subtracting a delta from a head figure — that is the CLAUDE.md rule this
      # instrument exists to serve, and an instrument that broke it would be worse
      # than no instrument. What it does NOT do is become a second place a worker
      # "measures at base and head": that rule stays on PR-body numbers. This
      # comment is where the numbers come FROM (#2128 part 11).
      - name: Resolve the base
        id: base
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -u
          # Belt and braces. `origin/$BASE_REF` WAS present in run 33779750324, whose
          # checkout was given a SHA as its `ref` — but nothing in `actions/checkout`'s
          # contract promises that ref for a SHA checkout, and if it ever goes missing
          # every arm below degrades to "no merge-base" for a reason that has nothing to
          # do with the base. Fetching it costs nothing and cannot fail the step.
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" >/dev/null 2>&1 || true
          base_sha="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
          if [ -z "$base_sha" ]; then
            {
              echo "sha="
              echo "source=none"
              echo "note=no merge-base against origin/$BASE_REF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "base merge-base: $base_sha"

          # Arm 1: the artifact the base commit's own CI run kept.
          run_id="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$base_sha&per_page=20" \
            --jq '[.workflow_runs[] | select(.status=="completed")] | .[0].id' 2>/dev/null || true)"
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            art_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name=="code-metrics" and .expired==false)] | .[0].id' 2>/dev/null || true)"
            if [ -n "$art_id" ] && [ "$art_id" != "null" ]; then
              if gh api "repos/$REPO/actions/artifacts/$art_id/zip" > base.zip 2>/dev/null \
                 && unzip -o -q base.zip -d base-artifact 2>/dev/null \
                 && [ -f base-artifact/code-metrics.json ]; then
                cp base-artifact/code-metrics.json base-metrics.json
                {
                  echo "source=artifact from run $run_id"
                  echo "note="
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          # Arm 2: measure the base ourselves. The INSTRUMENT stays the head's —
          # `scripts/code-metrics.cjs` is run from this checkout, with `--repo-root`
          # pointed at a worktree of the base — because a script that changed shape
          # with its subject would make the two sides incomparable. `require`
          # resolves `typescript` from this checkout's node_modules for the same
          # reason, so the base worktree needs no install of its own.
          #
          # No clippy on this arm: it is a full workspace build, and the Rust rows
          # printing `n/a` is the honest outcome, not a reason to spend eight
          # minutes here.
          if git worktree add --detach "$RUNNER_TEMP/base-tree" "$base_sha" >/dev/null 2>&1; then
            if node scripts/code-metrics.cjs report \
                 --repo-root "$RUNNER_TEMP/base-tree" \
                 --commit "$base_sha" \
                 --ref "$BASE_REF" \
                 --out base-metrics.json; then
              {
                echo "source=measured here on a worktree of the base"
                echo "note=the base run kept no code-metrics artifact, so the base was re-measured without clippy"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Arm 3.
          rm -f base-metrics.json
          {
            echo "source=unavailable"
            echo "note=no artifact for the base run and the base worktree could not be measured"
          } >> "$GITHUB_OUTPUT"

      - name: Build the delta comment
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -u
          # `...HEAD` — the diff against the merge-base, so a busy `main` underneath
          # this PR is not reported as lines the PR added.
          git diff "${{ steps.base.outputs.sha }}...HEAD" > pr.diff || true
          args=(--head code-metrics.json --diff pr.diff --out code-metrics-comment.md)
          if [ -f base-metrics.json ]; then
            args+=(--base base-metrics.json)
          fi
          node scripts/code-metrics.cjs delta \
            "${args[@]}" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --base-source "${{ steps.base.outputs.source }}" \
            --base-note "${{ steps.base.outputs.note }}"
          cat code-metrics-comment.md >> "$GITHUB_STEP_SUMMARY"

      # One comment, edited in place. The marker is the identity: the search is for
      # a comment BY THIS WORKFLOW'S BOT whose body starts with it, so a human
      # quoting the marker cannot capture the slot. `gh api` rather than a
      # marketplace action — nothing here needs one.
      - name: Post or update the sticky comment
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          [ -f code-metrics-comment.md ] || { echo "no comment body was built"; exit 0; }
          jq -Rs '{body: .}' code-metrics-comment.md > payload.json
          # `--jq` is applied ONCE PER PAGE, so on a PR past the first page of comments
          # this emits one line per page — `null` for every page with no match. Taking
          # `.[0].id` alone would then yield "null" and the id on separate lines and
          # splice a newline into the PATCH URL. Emit ids only, drop the nulls, and take
          # the first survivor: the oldest matching comment, so the slot is stable.
          existing="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate \
            --jq '.[] | select(.user.login=="github-actions[bot]") | select(.body | startswith("<!-- code-metrics -->")) | .id' 2>/dev/null \
            | grep -v '^null$' | head -n 1 || true)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input payload.json --silent
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input payload.json --silent
            echo "posted a new comment"
          fi
      # ----- end the per-PR delta comment (#2138 slice B) ----------------------

      - name: Upload the report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics
          path: code-metrics.json
          if-no-files-found: ignore
          retention-days: 30

  # ===== Code metrics over arbitrary commits (#2138 slice A) ================
  #
  # The dry-run instrument for #2128 slice C. Given a list of commits, this reports
  # on each one in turn and uploads a JSON per commit, so a proposed gate's
  # false-block count over already-merged PRs can be MEASURED before the gate is
  # armed. Manual only, and it does nothing at all unless `shas` is non-empty.
  #
  # Clippy is opt-in here because it is a full workspace build per commit; without
  # it the Rust rows are `n/a`, which the report says out loud rather than filling
  # in with a zero.
  code-metrics-dispatch:
    name: Code metrics over arbitrary commits
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.shas != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: ${{ inputs.clippy }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.clippy }}
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        if: ${{ inputs.clippy }}
        with:
          workspaces: .

      - name: Report on each commit
        continue-on-error: true
        shell: bash
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy
          # Through the environment, never interpolated into the script body: a
          # dispatch input is caller-supplied text, and `${{ }}` splices it in
          # before bash ever sees a quote.
          SHAS: ${{ inputs.shas }}
          WANT_CLIPPY: ${{ inputs.clippy }}
        run: |
          set -u
          mkdir -p dispatch-out
          # The scripts and the fixtures come from the commit that STARTED the run,
          # never from the commit being measured: an instrument that changes shape
          # per subject measures nothing comparable.
          mkdir -p .instrument && cp scripts/code-metrics.cjs .instrument/
          for sha in $(echo "$SHAS" | tr ',' ' '); do
            echo "::group::$sha"
            git checkout --force --detach "$sha" || { echo "::warning::unknown commit $sha"; echo "::endgroup::"; continue; }
            npm ci --no-audit --no-fund
            legs=()
            if [ "$WANT_CLIPPY" = "true" ]; then
              set +e
              cargo clippy --locked --workspace --message-format=json --quiet -- \
                --force-warn clippy::too_many_lines \
                --force-warn clippy::cognitive_complexity \
                --force-warn clippy::too_many_arguments \
                --force-warn clippy::unwrap_used \
                --force-warn clippy::expect_used \
                --force-warn clippy::panic \
                | node .instrument/code-metrics.cjs clippy --platform "ubuntu-22.04" --repo-root . --out "dispatch-out/clippy-$sha.json"
              set -e
              # An `if`, not `[ -f ] && …`: a false test as the last command of a
              # line would end the step under `set -e`, and a missing clippy file
              # is an expected outcome here, not a failure.
              if [ -f "dispatch-out/clippy-$sha.json" ]; then
                legs=(--clippy "dispatch-out/clippy-$sha.json")
              fi
            fi
            node .instrument/code-metrics.cjs report \
              --repo-root . \
              --commit "$sha" \
              --ref "dispatch" \
              "${legs[@]}" \
              --out "dispatch-out/code-metrics-$sha.json" \
              --summary "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

      - name: Upload the per-commit reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-metrics-dispatch
          path: dispatch-out/
          if-no-files-found: ignore
          retention-days: 30
